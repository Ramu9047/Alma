services:
  mongodb:
    image: mongo:7
    container_name: alma_mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - alma-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alma_backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/alma_db
      - ALMA_JWT_SECRET=AlmaCampusCommandCenter2025SecretKeyForHMACSHA256MustBe32Bytes!
      - ALMA_JWT_EXPIRATION_MS=86400000
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - alma-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: alma_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alma-network

networks:
  alma-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
