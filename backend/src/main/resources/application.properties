server.port=8080

# Disable MongoDB auto-configuration for local dev (no Mongo instance)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# JWT Configuration — secret loaded from environment variable, never hardcoded
# Set ALMA_JWT_SECRET in your environment or .env file before starting the backend.
jwt.secret=${ALMA_JWT_SECRET}
jwt.expiration-ms=${ALMA_JWT_EXPIRATION_MS:86400000}

# Groq LLM API Key (for future live Copilot integration)
groq.api-key=${GROQ_API_KEY:}
