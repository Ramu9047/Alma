server.port=${PORT:8080}

# MongoDB Configuration — connection URI loaded from MONGODB_URI env var
spring.data.mongodb.uri=${MONGODB_URI:mongodb://mongodb:27017/alma_db}

# JWT Configuration — secret loaded from environment variable, never hardcoded
# Set ALMA_JWT_SECRET in your environment or .env file before starting the backend.
jwt.secret=${ALMA_JWT_SECRET}
jwt.expiration-ms=${ALMA_JWT_EXPIRATION_MS:86400000}

# Groq LLM API Key (for future live Copilot integration)
groq.api-key=${GROQ_API_KEY:}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3005,http://localhost:8080,https://*.onrender.com,https://*.vercel.app}

# Security — suppress internal stacktrace leaks in API error responses
server.error.include-stacktrace=never
