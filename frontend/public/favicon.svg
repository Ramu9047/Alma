<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="almaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Circle -->
  <rect width="64" height="64" rx="20" fill="url(#almaGrad)" />

  <!-- Inner Subtle Ring -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Graduation Cap Icon -->
  <g filter="url(#glow)">
    <!-- Cap Diamond Top -->
    <path d="M32 16 L52 26 L32 36 L12 26 Z" fill="#FFFFFF" />
    <!-- Cap Base / Under Skullcap -->
    <path d="M20 31.5 V39.5 C20 44 44 44 44 39.5 V31.5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tassel -->
    <path d="M47 28.5 V41 C47 43 45 44 45 44" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="45" cy="45" r="2" fill="#FBBF24" />
  </g>

  <!-- Bottom Right Command Sparkle -->
  <path d="M50 48 L51.5 52 L55.5 53.5 L51.5 55 L50 59 L48.5 55 L44.5 53.5 L48.5 52 Z" fill="url(#starGrad)" />
</svg>
